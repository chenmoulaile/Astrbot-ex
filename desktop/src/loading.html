<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:"
    />
    <title>Astrb-RP</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
        background: #101418;
        color: #e6edf3;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .card {
        width: min(760px, 88vw);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 6px;
        letter-spacing: 0.4px;
      }
      .sub {
        color: #9198a1;
        font-size: 13px;
        margin-bottom: 18px;
      }
      .bar {
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(90deg, #2f81f7, #1f6feb 60%, #238636);
        width: 22%;
        animation: slide 1.6s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          width: 8%;
          margin-left: 0;
        }
        50% {
          width: 55%;
        }
        100% {
          width: 8%;
          margin-left: 92%;
        }
      }
      .row {
        display: flex;
        gap: 8px;
        margin: 16px 0;
        flex-wrap: wrap;
      }
      button {
        background: #21262d;
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 7px 13px;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover {
        border-color: #2f81f7;
      }
      .err {
        color: #f85149;
        font-size: 13px;
        min-height: 18px;
      }
      pre {
        background: #0d1117;
        border: 1px solid #21262d;
        border-radius: 8px;
        padding: 12px;
        height: 210px;
        overflow: auto;
        font-size: 11.5px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-all;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Astrb-RP 桌面端</h1>
      <div class="sub" id="sub">正在启动本地内核…</div>
      <div class="bar" id="bar"></div>
      <div class="row">
        <button id="pick">选择项目目录</button>
        <button id="restart">重启内核</button>
        <button id="open">在浏览器打开</button>
      </div>
      <div class="err" id="err"></div>
      <pre id="log"></pre>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      const api = window.desktop;

      function setLog(lines) {
        $('log').textContent = (lines || []).join('\n');
        $('log').scrollTop = $('log').scrollHeight;
      }

      api.getState().then((state) => {
        setLog(state.log);
        if (!state.settings.repoRoot) {
          $('sub').textContent = '需要先选择 Astrb-RP 项目目录（含 main.py 的那个文件夹）';
        }
      });

      api.onLog(setLog);
      api.onStatus((status) => {
        $('err').textContent = status.error || '';
        if (status.phase === 'ready' && status.port) {
          $('sub').textContent = `内核已就绪，正在打开面板 http://127.0.0.1:${status.port}`;
          $('bar').style.animation = 'none';
        } else if (status.port) {
          $('sub').textContent = `内核启动中（端口 ${status.port}，首次启动要装依赖，稍慢）…`;
        }
      });

      $('pick').onclick = () => api.chooseRepo();
      $('restart').onclick = () => api.restartBackend();
      $('open').onclick = () => api.openDashboard();
    </script>
  </body>
</html>
